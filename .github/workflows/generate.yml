name: NEOUL auto-generate (all-subject, Opus 5 primary, model floor)
on:
  schedule:
    - cron: '0 21 * * 0'   # 매주 월요일 06:00 KST (일 21:00 UTC)
  workflow_dispatch:
    inputs:
      only:
        description: 'pilot subjects (comma, e.g. 미적분,물리학1). blank=all'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: neoul-generate
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium (Playwright) + Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-cjk-extra
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Generate all subjects (Opus 5 effort-high primary, KaTeX + inline SVG)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ONLY_SUBJECTS: ${{ github.event.inputs.only }}
        run: node scripts/generate.mjs
      - name: Commit and push (Vercel auto-deploy)
        run: |
          git config user.name "neoul-bot"
          git config user.email "bot@neoulai.com"
          git add frontend/materials frontend/materials.json frontend/qc_report.json frontend/tutor_kb.json
          git commit -m "chore(auto): materials $(date -u +%F)" || { echo "no change"; exit 0; }
          git push
